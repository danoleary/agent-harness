# Gates for the standalone harness repo.
#
# `make check` is the single source of truth for the gate (format, vet, the
# script guards, the full test suite), so a guard added to that target runs here
# with no edit to this file. The check-ci guard — itself a prerequisite of
# `check` — fails the build if this step list ever drifts back to re-enumerating
# `check`'s sub-targets, which is how a guard once stayed CI-invisible.
#
# NOTE: inside a Consumer's subtree this file is INERT — GitHub reads only the
# repo-root `.github`. It goes live when scripts/extract-standalone.sh lifts this
# subtree to the root of the standalone repo (ADR-0007).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    name: Check, build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - name: Check
        run: make check
      - name: Script test coverage
        # Fail if a changed scripts/<name>.sh with a sibling test-<name>.sh ships
        # without touching that test. `make check` only RUNS the tests that
        # exist, so an uncovered behavioral change otherwise sails through green.
        # Diff-based, so it is kept out of `make check` to keep that target
        # offline-runnable; the checkout is shallow with no origin/main ref, so
        # fetch main's tip and compare against that.
        run: |
          git fetch --no-tags --depth=1 origin main
          ./scripts/require-script-test-coverage.sh FETCH_HEAD
      - name: Build
        run: make build

  base-image:
    runs-on: ubuntu-latest
    name: Base image builds
    # The base image is the harness<->sandbox contract every Consumer FROMs
    # (ADR-0008), so a Dockerfile.base that no longer builds must fail here, not
    # at release time. Build only — publishing is release.yml's job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build (amd64 only, not pushed)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile.base
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  self-image:
    runs-on: ubuntu-latest
    name: Self-hosting image runs the gate's toolchain
    # A Gate runs `bash -lc` through the entrypoint, and a login shell's
    # /etc/profile resets PATH — so a toolchain on PATH only via Dockerfile ENV is
    # invisible to the Gate, and `make check` exits 127 host-side (#40). Build this
    # repo's own sandbox image and probe it the way a Gate runs it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the base under the pinned tag
        # Build the base from THIS commit and tag it as the ref the self image
        # pins, rather than pulling it: on a release commit that pin names a base
        # release.yml has not published yet. The runner is throwaway, so the
        # local tag shadows nothing.
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^FROM \(ghcr\.io\/[^ ]*agent-harness-base:[^ ]*\).*/\1/p' .agent-harness/Dockerfile)"
          test -n "$pin" || { echo "no base pin in .agent-harness/Dockerfile"; exit 1; }
          docker build -f Dockerfile.base -t "$pin" .
      - name: Build the self-hosting image
        run: docker build -f .agent-harness/Dockerfile -t agent-harness-self:ci .agent-harness
      - name: Probe the toolchain in a login shell
        run: ./scripts/check-sandbox-image.sh agent-harness-self:ci go gofmt
