# Publish a harness release: cross-platform binaries on GitHub Releases, and the
# sandbox base image on GHCR (ADR-0007).
#
# Binaries are the PRIMARY distribution path. Target Consumers are not all Go
# shops and must not need a Go toolchain to run the harness; `go install` stays a
# convenience for those that have one.
#
# Both artifacts carry the SAME tag, so `agent-harness v0.1.0` and
# `agent-harness-base:0.1.0` are always a matched pair — a Consumer that pins the
# base can look up the harness build that shares its contract.
#
# NOTE: inside a Consumer's subtree this file is INERT — GitHub reads only the
# repo-root `.github`. It goes live when scripts/extract-standalone.sh lifts this
# subtree to the root of the standalone repo (ADR-0007).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist.'
        required: true

permissions:
  contents: read

env:
  # The base image is named for the repo it ships from, so a fork publishes to
  # its own namespace with no edit here.
  BASE_IMAGE: ghcr.io/${{ github.repository }}-base

jobs:
  binaries:
    runs-on: ubuntu-latest
    name: Cross-platform binaries
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Build every tool for every supported host
        # The harness host needs docker, git and gh, which rules out a pure-Windows
        # host; darwin and linux on both architectures cover the real targets.
        # CGO_ENABLED=0 keeps each binary statically linked so it runs on any libc.
        #
        # The archive layout IS the installed layout (ADR-0012), and install.sh
        # copies it across verbatim:
        #
        #   agent-harness                  the dispatcher — the one name that goes on PATH
        #   libexec/agent-harness/<tool>   the six stage binaries, kept OFF the PATH
        #   scripts/loop-start.sh          the detached-daemon launcher
        #   README.md CONSUMER.md LICENSE .env.example
        #
        # The stage binaries are named for their role (loop, watch, review, …) and
        # those words are far too generic for a shared bin dir — `watch` alone
        # would shadow procps' watch(1). Keep them under libexec/; anything that
        # moves one to the archive root puts it back on operators' PATH.
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          for platform in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            stage="dist/agent-harness_${version}_${goos}_${goarch}"
            mkdir -p "$stage/libexec/agent-harness" "$stage/scripts"
            for tool in agent-harness implementation review retrospective pipeline loop watch; do
              # The dispatcher sits at the archive root; everything it dispatches
              # to sits under libexec/.
              case "$tool" in
                agent-harness) out="$stage/agent-harness" ;;
                *)             out="$stage/libexec/agent-harness/$tool" ;;
              esac
              # -X stamps the release tag into internal/version, which `--version`
              # prints and a Consumer's `min_harness_version` pin is checked
              # against. Without it every release reports "dev" and the pin check
              # silently degrades to a skip.
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -buildvcs=false -trimpath \
                -ldflags "-s -w -X github.com/danoleary/agent-harness/internal/version.Version=${version}" \
                -o "$out" "./cmd/$tool"
            done
            # Ship the Consumer-facing docs beside the binaries so an operator who
            # only ever downloads a tarball still has the adoption contract.
            #
            # .env.example and loop-start.sh travel with them because the quickstart
            # instructs an operator to use BOTH — "cp .env.example .env" and the
            # detached launcher — and a download-only operator has no checkout to
            # find either in. Omitting them made the documented quickstart
            # impossible to follow from a release archive.
            cp README.md docs/CONSUMER.md LICENSE .env.example "$stage/"
            cp scripts/loop-start.sh "$stage/scripts/"
            tar -czf "${stage}.tar.gz" -C dist "$(basename "$stage")"
            rm -rf "$stage"
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)
          ls -la dist

      - name: Check the archive against what install.sh expects
        # install.sh unpacks these archives and refuses a partial one, so a layout
        # drift here surfaces as a broken one-liner for every new operator, with
        # nothing failing on our side. Assert the contract at the point it is
        # produced. (scripts/test-install.sh covers the other direction: the
        # installer against a fixture archive in this same shape.)
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          probe="$(mktemp -d)"
          tar -xzf "dist/agent-harness_${version}_linux_amd64.tar.gz" -C "$probe"
          root="$probe/agent-harness_${version}_linux_amd64"
          test -x "$root/agent-harness" || { echo "no dispatcher at the archive root"; exit 1; }
          for tool in implementation review retrospective pipeline loop watch; do
            test -x "$root/libexec/agent-harness/$tool" || { echo "missing libexec/agent-harness/$tool"; exit 1; }
            test ! -e "$root/$tool" || { echo "$tool is at the archive root — it would land on operators' PATH"; exit 1; }
          done
          test -f "$root/scripts/loop-start.sh" || { echo "missing scripts/loop-start.sh"; exit 1; }
          test -f "$root/.env.example" || { echo "missing .env.example"; exit 1; }
          test -f "$root/CONSUMER.md" || { echo "missing CONSUMER.md"; exit 1; }
          echo "archive layout OK"

      - name: Publish to GitHub Releases
        # `gh release` rather than a third-party action: one less trusted
        # dependency in the path that produces the artifact Consumers execute.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          if ! gh release view "$version" >/dev/null 2>&1; then
            gh release create "$version" --title "$version" --generate-notes
          fi
          # install.sh ships as a release asset as well as living on main, so an
          # operator can pin the installer to the release it installs:
          #   curl -fsSL https://github.com/danoleary/agent-harness/releases/download/<tag>/install.sh | sh
          gh release upload "$version" dist/*.tar.gz dist/checksums.txt install.sh --clobber

  base-image:
    runs-on: ubuntu-latest
    name: Sandbox base image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # arm64 matters: an Apple Silicon operator running an amd64-only base pays
      # emulation for every session, and some toolchains simply fail under it.
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the image tags
        # An IMMUTABLE semver tag is the one a Consumer Dockerfile pins, so that a
        # base bump is a deliberate, reviewable edit and never a silent floating
        # pull. `latest` moves, and exists only for a first-look `docker run`.
        id: tags
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          echo "semver=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:${{ steps.tags.outputs.semver }}
            ${{ env.BASE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
