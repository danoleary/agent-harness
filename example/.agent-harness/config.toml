# A complete, working example Consumer config (ADR-0008).
#
# docs/reference/config.md documents every key in it, and it is LOADED BY THE TEST
# SUITE — an example that stopped parsing, or that drifted from the loader's
# validation, fails CI rather than misleading the next person who copies it.
#
# It describes a hypothetical .NET project. Nothing here is a credential; secrets
# and host paths are environment-only (see .env.example).

# The sandbox image. Declare EXACTLY ONE of these two shapes: a `dockerfile` the
# harness BUILDS on a local miss, or a prebuilt `image` ref it PULLS. Declaring
# neither is a hard error at load — there is no sane cross-language default.
image = "example-agent-harness:latest"
dockerfile = ".agent-harness/Dockerfile"

# Canonical worktree branch prefix; the harness keys verify/push/PR off
# `<branch_prefix>/<slug>`. Defaults to "feat" when omitted.
branch_prefix = "feat"

# Per-worktree toolchain setup, run in a secret-free container against the freshly
# created worktree (cwd = the worktree, $PROJECT_PATH = the main checkout).
#
# It MUST be idempotent: the harness runs it on every provisioning pass, including
# a resumed worktree, which routinely has its dependencies missing while still
# looking ready from the outside. Prefer lockfile-frozen, already-satisfied-is-a-
# no-op commands.
post_create = '''
dotnet restore
'''

# Directory prefixes whose contents can feed a gate or a CI job whatever they look
# like. The harness skips the review gate re-run and the CI poll when a branch's
# whole diff is inert prose OUTSIDE these roots.
#
# Omitting this DISABLES that short-circuit rather than widening it — the safe
# direction, since excluding too much only costs a CI poll nobody needed, while
# excluding too little means merging past a job that could go red. Keep it a
# superset of every root your workflows' `on.pull_request.paths` trigger on.
docs_only_excluded_roots = ["src/", "tests/", ".github/", "scripts/"]

# Worktree-relative paths deleted on handoff, so a reviewer on another platform
# never inherits the sandbox's linux-arm64 build output. The review stage
# re-provisions the worktree with post_create. Omitting this strips nothing.
handoff_strip_paths = ["obj", "bin"]

# Checkout-relative roots the resolved-symbol dispatch advisory greps. Omitting
# this disables the advisory rather than guessing a path.
source_roots = ["src"]

# Optional persistent toolchain cache, mounted into every sandbox and gate
# container so the per-worktree restore is a local copy rather than a network
# fetch. Omit the section entirely if your toolchain has no useful cache.
[cache]
volume = "example-nuget"
path = "/root/.nuget/packages"
# Host-side cache reclaim, run by the loop between tickets when free disk is low.
# Omitting it skips that rung of the reclaim ladder.
prune_command = "dotnet nuget locals all --clear"

# Tracker selection plus its NON-SECRET names. The API credential is env-only.
[tracker]
kind = "github"
repo = "example-org/example-repo"
# The label every harness finding is filed under.
findings_label_id = "agent-harness"
# The human-applied blast-radius gate: only labelled tickets are worked unattended.
ready_label = "ready-for-agent"
# Optional: a label that screens a ticket out until a human removes it. Usually
# unneeded: link a dependency natively ("blocked by") and the ticket waits until
# its blocker closes; leave the ready label off to hold it for any other reason.
# blocked_label = "blocked"
# GitHub issues have only open/closed, so the claim is modelled as a label.
in_progress_label = "in-progress"

# Ordered, named host-side gates. ALL must pass before the harness pushes and
# opens the PR. Language-agnostic — these are just shell commands.
[[gates]]
name = "test"
command = "dotnet test"

[[gates]]
name = "format"
command = "dotnet format --verify-no-changes"

# Optional: the loops `agent-harness loop <name>` runs (ADR-0019). Without any
# [[loops]], two built-in loops stand: "tickets", which a bare `agent-harness
# loop` runs, and "pr-doctor", which fixes open PRs that conflict with main or
# have red CI. An entry of the same name replaces a built-in; any other name adds
# a loop. `agent-harness loop --list` prints them, and `agent-harness loop <name>
# --dry-run` prints one as it resolved.
#
# A loop is a Source and an ordered list of Steps, both from fixed sets the
# harness implements, so each Step keeps its own host-side check: you can choose,
# order and parameterise Steps and give a Step a prompt body, but not add a Step
# that runs a shell command or an agent with nothing checking it. Every problem is
# reported at load, with its line and column.
#
# The built-in ticket loop, written out (uncomment to change it). Drop watch_ci
# when you run pr-doctor: the review stage then stops once the PR is open instead
# of waiting on CI, and pr-doctor fixes a check that goes red later.
# [[loops]]
# name = "tickets"
# source = { kind = "tracker" }
# steps = [{ use = "implement" }, { use = "review" }, { use = "watch_ci" }, { use = "retro" }]
#
# The PR loop, with a project body for its fix sessions and its own limits. Each
# limit overrides its LOOP_* env knob for this loop only; source.label and
# source.max_attempts override PR_LOOP_LABEL and PR_LOOP_MAX_ATTEMPTS. Stop it
# alone with `touch .agent-harness/STOP-pr-doctor`; a plain STOP stops every loop.
[[loops]]
name = "pr-doctor"
poll_interval = "10m"
max_consecutive_failures = 3
source = { kind = "github_prs", label = "agent-maintained", when = ["conflicting", "ci_failing"] }
steps = [
  { use = "checkout_pr" },
  { use = "fix", prompt = "prompts/fix-pr.md" },
  { use = "gates" },
  { use = "push_existing" },
  { use = "watch_ci" },
  { use = "retro" },
]
